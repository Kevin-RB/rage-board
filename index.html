<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Board layout prototype</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- Prototype-only controls. Nothing in this strip is part of the Board. -->
    <form id="lab" class="lab" aria-label="Prototype controls">
      <strong class="lab-tag">Prototype</strong>
      <label>Crowding
        <select id="lab-strategy">
          <option value="hybrid">Columns, then overlap</option>
          <option value="hours">Wall = Shift (sized by hours)</option>
          <option value="columns">More columns only</option>
          <option value="shrink">Shrinking text only</option>
          <option value="scroll">Scrolling only</option>
          <option value="pile">Overlapping only</option>
        </select>
      </label>
      <label>Controls
        <select id="lab-placement">
          <option value="rail">Side rail</option>
          <option value="band">Top band</option>
        </select>
      </label>
      <label>Look
        <select id="lab-theme">
          <option value="light">Clean office (light)</option>
          <option value="dark">Control room (dark)</option>
        </select>
      </label>
      <label>View from
        <select id="lab-distance">
          <option value="1">Your desk</option>
          <option value="0.35">2 m away</option>
          <option value="0.18">4 m away</option>
          <option value="0.12">6 m away</option>
        </select>
      </label>
      <span class="lab-group" role="group" aria-label="Fill the Board">
        <button type="button" data-fill="20">20%</button>
        <button type="button" data-fill="60">60%</button>
        <button type="button" data-fill="90">90%</button>
        <button type="button" data-fill="150">150%</button>
        <button type="button" data-fill="300">300%</button>
      </span>
      <span class="lab-group" role="group" aria-label="Awkward cases">
        <button type="button" data-case="many">100 Tasks</button>
        <button type="button" data-case="tiny">50 × 15m</button>
        <button type="button" data-case="huge">One 12h Task</button>
        <button type="button" data-add="1">+1</button>
        <button type="button" data-add="5">+5</button>
        <button type="button" data-add="20">+20</button>
      </span>
      <button type="button" id="lab-phone">Phone view</button>
      <button type="button" id="lab-hide" title="Press H to bring it back">Hide (H)</button>
    </form>

    <div class="stage">
      <main id="board" class="board">
        <section class="overload" aria-label="Overload">
          <p class="today" id="today"></p>
          <p class="overload-label">Overload</p>
          <output class="overload-value" id="overload-value">0%</output>
          <div class="meter" aria-hidden="true">
            <div class="meter-fill" id="meter-fill"></div>
            <i style="--at: 25%"></i><i style="--at: 50%"></i><i style="--at: 75%"></i>
          </div>
          <p class="overload-detail">
            <span id="stage-name">Calm</span> · <span id="total-hours">0h</span> of
            <label class="shift">
              <span class="visually-hidden">Shift length in hours</span>
              <input id="shift" type="number" min="1" max="24" step="0.5" inputmode="decimal" />h
            </label>
            Shift · <span id="task-count">0 Tasks</span>
          </p>
        </section>

        <form id="add" class="add" autocomplete="off">
          <label class="add-title">
            <span>What do they want?</span>
            <input id="title" type="text" required placeholder="Task title" enterkeyhint="done" />
          </label>
          <fieldset class="estimates">
            <legend>Estimate</legend>
            <label><input type="radio" name="estimate" value="15" /><span>15m</span></label>
            <label><input type="radio" name="estimate" value="30" /><span>30m</span></label>
            <label><input type="radio" name="estimate" value="60" checked /><span>1h</span></label>
            <label><input type="radio" name="estimate" value="120" /><span>2h</span></label>
            <label><input type="radio" name="estimate" value="240" /><span>4h</span></label>
            <label><input type="radio" name="estimate" value="custom" /><span>Custom</span></label>
          </fieldset>
          <label class="custom" id="custom-row" hidden>
            <span>Hours</span>
            <input id="custom" type="number" min="0.25" step="0.25" value="3" inputmode="decimal" />
          </label>
          <button class="primary" type="submit">Yeah, sure</button>
        </form>

        <details class="utilities" id="utilities">
          <summary>Sound and New day</summary>
          <div class="utilities-body">
            <button type="button" id="mute" aria-pressed="false">Sound on</button>
            <label class="volume">
              <span class="visually-hidden">Volume</span>
              <input id="volume" type="range" min="0" max="100" />
            </label>
            <button type="button" id="new-day">New day</button>
          </div>
        </details>

        <section class="wall" id="wall" aria-label="Tasks">
          <p class="empty" id="empty">No requests yet.</p>
        </section>
      </main>
    </div>

    <dialog id="confirm" class="confirm">
      <form method="dialog">
        <h2>Start a new day?</h2>
        <p>This clears every Task on the Board.</p>
        <div class="confirm-actions">
          <button value="cancel" autofocus>Keep them</button>
          <button value="ok" class="primary">Start new day</button>
        </div>
      </form>
    </dialog>

    <dialog id="phone" class="phone">
      <form method="dialog"><button>Close phone view</button></form>
      <iframe id="phone-frame" title="Phone view of the Board" width="390" height="844"></iframe>
    </dialog>
  </body>
</html>
