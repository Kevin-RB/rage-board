<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Board layout prototype</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- Prototype-only controls. Nothing in this strip is part of the Board. -->
    <form id="lab" class="lab" aria-label="Prototype controls">
      <strong class="lab-tag">Prototype</strong>
      <label>Note font
        <select id="lab-font">
          <option value="relief">Comic Relief (bundled)</option>
          <option value="comic">Comic Sans (if installed)</option>
          <option value="clean">Clean</option>
        </select>
      </label>
      <label>View from
        <select id="lab-distance">
          <option value="1">Your desk</option>
          <option value="0.35">2 m away</option>
          <option value="0.18">4 m away</option>
          <option value="0.12">6 m away</option>
        </select>
      </label>
      <span class="lab-group" role="group" aria-label="Fill the Board">
        <button type="button" data-fill="20">20%</button>
        <button type="button" data-fill="60">60%</button>
        <button type="button" data-fill="90">90%</button>
        <button type="button" data-fill="150">150%</button>
        <button type="button" data-fill="300">300%</button>
      </span>
      <span class="lab-group" role="group" aria-label="Awkward cases">
        <button type="button" data-case="many">100 Tasks</button>
        <button type="button" data-case="long">Long titles</button>
        <button type="button" data-case="huge">One 12h Task</button>
        <button type="button" data-add="1">+1</button>
        <button type="button" data-add="5">+5</button>
      </span>
      <button type="button" id="lab-reset">Reset positions</button>
      <button type="button" id="lab-phone">Phone view</button>
      <button type="button" id="lab-hide" title="Press H to bring it back">Hide (H)</button>
    </form>

    <div class="stage">
      <main id="board" class="board">
        <aside class="rail">
          <section class="panel overload" aria-label="Overload">
            <div class="overload-top">
              <p class="today" id="today"></p>
              <p class="stage-chip" id="stage-chip"><span id="stage-icon"></span><span id="stage-name">Calm</span></p>
            </div>
            <output class="overload-value" id="overload-value">0%</output>
            <p class="overload-label">Overload</p>
            <div class="meter" aria-hidden="true"><div class="meter-fill" id="meter-fill"></div></div>
            <dl class="stats">
              <div>
                <dt><i data-lucide="hourglass"></i>Booked</dt>
                <dd id="total-hours">0h</dd>
              </div>
              <div>
                <dt><i data-lucide="sticky-note"></i>Tasks</dt>
                <dd id="task-count">0</dd>
              </div>
              <div>
                <dt><i data-lucide="briefcase"></i>Shift</dt>
                <dd class="stepper">
                  <button type="button" id="shift-down" aria-label="Shorter Shift"><i data-lucide="minus"></i></button>
                  <output id="shift">8h</output>
                  <button type="button" id="shift-up" aria-label="Longer Shift"><i data-lucide="plus"></i></button>
                </dd>
              </div>
            </dl>
          </section>

          <form id="add" class="panel add" autocomplete="off">
            <label>
              <span class="visually-hidden">Task title</span>
              <input id="title" type="text" required placeholder="What do they want?" enterkeyhint="done" />
            </label>
            <div class="add-options">
              <label class="pill">
                <i data-lucide="clock"></i>
                <span class="visually-hidden">Estimate</span>
                <select id="estimate">
                  <option value="15">15m</option>
                  <option value="30">30m</option>
                  <option value="60" selected>1h</option>
                  <option value="120">2h</option>
                  <option value="240">4h</option>
                  <option value="custom">Custom…</option>
                </select>
              </label>
              <label class="pill" id="custom-row" hidden>
                <span class="visually-hidden">Custom Estimate in hours</span>
                <input id="custom" type="number" min="0.25" step="0.25" value="3" inputmode="decimal" />h
              </label>
              <button type="button" class="pill" id="color-button" popovertarget="color-menu">
                <span id="color-current"></span>
                <span id="color-label">Random</span>
              </button>
              <div id="color-menu" class="color-menu" popover>
                <button type="button" class="color-random" data-pick="random"><i data-lucide="shuffle"></i>Random</button>
                <div class="swatches" id="color-swatches"></div>
              </div>
            </div>
            <button class="primary" type="submit"><i data-lucide="plus"></i>Yeah, sure</button>
          </form>

          <footer class="utilities">
            <button type="button" class="icon-button" id="mute" aria-pressed="false" aria-label="Mute">
              <i data-lucide="volume-2" class="when-on"></i>
              <i data-lucide="volume-x" class="when-off"></i>
            </button>
            <label class="volume">
              <span class="visually-hidden">Volume</span>
              <input id="volume" type="range" min="0" max="100" />
            </label>
            <button type="button" class="icon-button" id="surface"><i data-lucide="grip"></i></button>
            <button type="button" class="quiet" id="new-day"><i data-lucide="sunrise"></i>New day</button>
          </footer>
        </aside>

        <section class="wall" id="wall" aria-label="Tasks">
          <p class="empty" id="empty"><i data-lucide="coffee"></i>Nothing yet. Enjoy it.</p>
        </section>
      </main>
    </div>

    <!-- The note, up close: the full title, and everything you can change about it. -->
    <dialog id="editor" class="editor" aria-label="Edit Task">
      <form method="dialog" class="editor-close">
        <button class="icon-button" aria-label="Close"><i data-lucide="x"></i></button>
      </form>
      <label>
        <span class="visually-hidden">Task title</span>
        <textarea id="editor-title" rows="1"></textarea>
      </label>
      <div class="editor-row">
        <label class="pill">
          <i data-lucide="clock"></i>
          <span class="visually-hidden">Estimate in hours</span>
          <input id="editor-hours" type="number" min="0.25" step="0.25" inputmode="decimal" />h
        </label>
        <div class="swatches" id="editor-swatches"></div>
      </div>
      <div class="editor-row editor-actions">
        <button type="button" class="quiet" id="editor-remove"><i data-lucide="trash-2"></i>Remove</button>
        <button type="button" class="primary" id="editor-done"><i data-lucide="check"></i>Done</button>
      </div>
    </dialog>

    <dialog id="confirm" class="confirm">
      <form method="dialog">
        <h2><i data-lucide="sunrise"></i>Start a new day?</h2>
        <p>This clears every Task on the Board.</p>
        <div class="confirm-actions">
          <button value="cancel" class="quiet" autofocus>Keep them</button>
          <button value="ok" class="primary">Start new day</button>
        </div>
      </form>
    </dialog>

    <dialog id="phone" class="phone">
      <form method="dialog"><button class="quiet">Close phone view</button></form>
      <iframe id="phone-frame" title="Phone view of the Board" width="390" height="844"></iframe>
    </dialog>
  </body>
</html>
